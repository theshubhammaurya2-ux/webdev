<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shubham maurya </title>
    <style>
        body{
            background-color: black;
            color:white;

        }
        @media(max-width:600px){
            body{
                background-color:yellow;

            }}
        @media (min-width:75px) and (max-width:167px){
           body{
            background-color:black;
        }}

        @media(min-width:45px){
          body{
            background-color:black;}
        }


        .container{
              display:flex;
              flex-wrap: wrap;  /*for responsive*/
        }
        .container .card{
             width:250px;
              height:150px;
              background-color: blue;
              border:2px solid red;
              margin:12px;
              border-radius: 25%;
            box-shadow:0 0 120px #ccc;
            text-align: center;
            align-items: center;
            justify-content: center;
        }
        
    </style>
   
</head>
<body>
     <h1>This is css media queries</h1>
     <!-- <img src="WIN_20260606_15_19_06_Pro.jpg" alt=""> -->
     <div class="container">
     <div class="card">c1</div>
     <div class="card">c2</div>
     <div class="card">c3</div>
</div
body>
</html>

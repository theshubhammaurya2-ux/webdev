<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>limit ke sppeed</title>

    <style>
        body{
            background-color: black;
        }
   .child{
    height:100px;
    width:100px;
    background-color:rgb(72, 255, 0);
    margin:10px;
    display: block;
  
    
   }
 .child:nth-child(1) {
         order: 1;
   }
 .child:nth-child(2) {
         order: 2;
   }
   .child:nth-child(3) {
         order: 0;
   }
   .parent{
    background-color:yellow; 
    display:flex;
    justify-content:center;
    align-items: center;
    padding:10px;
    
   }
    </style>

</head>
<body>
 <div class="parent">
    <div class="child">1</div>
    <div class="child">2</div>
    <div class="child">3</div>
    <div class="child">4</div>
    <div class="child">1</div>
    <div class="child">2</div>
    <div class="child">3</div>
    <div class="child">4</div>
</div>
</body>
</html>

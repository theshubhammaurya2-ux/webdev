<body>


<!-- fullfiled reject pending -->
 <script>
    let dohomework=new Promise((resolve,reject)=>{
        let completed=true;
        console.log("done homework")
        setTimeout(()=>{
            if(completed){
                resolve("home work fini+shed")
            }
            else{
                reject("didnt finished")
            }
        },2000)
    })
 dohomework.then(msg=>console.log(msg)).catch(msg=>console.log(msg))



const donehomework=()=>{
    return new Promise((resolve)=>{setTimeout(()=> {
        resolve("homework done")
    }, 2000);
})
}
    
const revise=()=>{
    return new Promise((resolve)=>{setTimeout(()=> {
        resolve("revision")
    }, 1500);
})
}
  

const playgames=()=>{
    return new Promise((resolve)=>{setTimeout(()=> {
        resolve("played gaME")
    }, 1000);
})
}
  
donehomework().then(res=>{
    console.log(res);
    return revise();
}).then(res=>{
    console.log(res);
    return playgames();
}).then(res=>{
    console.log(res);
    
}).catch(err=>console.log(err));



//async//await 
//better way
const dailyroutine=async()=>{
    try{
        let homeworkstatus=await donehomework();
        console.log(homeworkstatus);
        let revisionstatus=await revise();
        console.log(revisionstatus);
          let playedstatus=await playgames();
        console.log(playedstatus);
    }catch(error){
        console.log(error)
    }
};
dailyroutine();
 </script>

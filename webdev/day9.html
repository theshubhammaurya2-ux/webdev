<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            color:white;
        }
        .gridcontainer{

            display: grid;
              /* grid-template-columns:  auto  auto; */
            /* grid-template-columns: 500px auto  auto; */
            /* grid-template-columns:  1fr ; */
            /* grid-template-columns:  1fr 1fr ; */
            /* grid-template-columns:  3fr 1fr ; */
            
            
            /* grid-template-rows: 250px 250px; */
            /* grid-template-columns: 250px 250px;
             */
         grid-template-columns:repeat(4,1fr);
             gap:10px;   

        }
        .gridcontainer >div{
            background-color: #89cff0;
            padding :20px;
            text-align: center;
            color:blueviolet;
            font-size: larger;
        }
        .items:nth-child(1){
            background-color: yellow;
        }
                .items:nth-child(12){
            background-color: yellow;
            /* grid-column-end: 8; 
            grid-column-start:3 ;*/
            grid-column: 1/3;
        }

             .items:nth-child(4){
                background-color: azure;
                color: black;
                /* grid-row-start: 2;
                grid-row-end: 4; */
                /* grid-row:2/5;
                grid-column: 3/4; */
                grid-row:1/2;
                grid-column:1/span 4 ;
                
             }
        .items:nth-child(3){
            grid-area: 1/2 span 2/span 3;
        }
             
    </style>
</head>
<body>
    <h1>css grid</h1>
    <div class="gridcontainer">
        <div class="items">item1</div>
        <div class="items">item2</div>
        <div class="items">item3</div>
        <div class="items">janki good</div>
        <div class="items">item1</div>
        <div class="items">item2</div>
        <div class="items">item3</div>
        <div class="items">item4</div>
        <div class="items">item1</div>
        <div class="items">item2</div>
        <div class="items">item3</div>
        <div class="items">janki bus</div>
   
    </div>
</body>
</html>
